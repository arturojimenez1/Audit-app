services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: audit-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - /var/www/html/vendor

    networks:
      - audit-network
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_URL: http://localhost:8000
      TMPDIR: /tmp
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: audit
      DB_USERNAME: audit
      DB_PASSWORD: secret

  nginx:
    image: nginx:alpine
    container_name: audit-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - audit-network
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    container_name: audit-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: audit
      MYSQL_USER: audit
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - audit-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootsecret"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  node:
    image: node:20-alpine
    container_name: audit-node
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "5173:5173"
    networks:
      - audit-network
    command: sh -c "npm install && npm run dev -- --host"


networks:
  audit-network:
    driver: bridge

volumes:
  mysql-data:
